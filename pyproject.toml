[project]
name = "server"
version = "0.1.0"
description = ""
keywords = [ "packaging", "poetry" ]
authors = [
    {name = "EllaiSys",email = "ellaisys@gamil.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.0,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "fastapi[standard] (>=0.129.0,<0.130.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "fastapi-mcp (>=0.4.0,<0.5.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "pydantic-extra-types (>=2.11.0,<3.0.0)",
    "phonenumbers (>=9.0.24,<10.0.0)",
    "boto3 (>=1.42.49,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "aiomysql (>=0.3.2,<0.4.0)",
    "sqlalchemy[asyncio] (>=2.0.46,<3.0.0)"
]
dynamic = ["scripts", "entry-points"]

[project.scripts]
api_app = "server.api:start_api_server"

[tool.poetry]
packages = [{include = "server", from = "src"}]

[tool.poetry.scripts]
api_app = "server.api:start_api_server"
mcp_app = "server.mcp:start_mcp_server"

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
